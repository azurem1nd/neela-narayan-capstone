{#- Reusable inline-SVG graphic accents for context cards. Each macro
   draws in currentColor so the card's own --ctx-accent sets the
   color; positioning/sizing is handled by the CSS class applied to
   the <svg>, not here. Approximates the hand-drawn/graphic elements
   from the six reference card designs -- organic line art by nature,
   not pixel-traced. -#}

{% macro dots() %}
<svg class="ctx-card__graphic ctx-card__graphic--dots" viewBox="0 0 240 200" aria-hidden="true">
  <circle cx="205" cy="22" r="19"/>
  <circle cx="155" cy="30" r="19"/>
  <circle cx="235" cy="60" r="19"/>
  <circle cx="180" cy="68" r="19"/>
  <circle cx="120" cy="55" r="17"/>
  <circle cx="210" cy="100" r="19"/>
  <circle cx="150" cy="105" r="17"/>
  <circle cx="235" cy="140" r="17"/>
  <circle cx="185" cy="145" r="17"/>
</svg>
{% endmacro %}

{% macro checker_wave(uid) %}
<svg class="ctx-card__graphic ctx-card__graphic--checker" viewBox="0 0 100 460" aria-hidden="true">
  <defs>
    <clipPath id="checker-curve-{{ uid }}">
      <path d="M 60 0 C -10 70, 130 150, 20 230 C -50 290, 110 340, 40 410 C 10 440, 30 455, 55 460 L 100 460 L 100 0 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#checker-curve-{{ uid }})">
    {% for row in range(12) %}
      {% for col in range(3) %}
        {% if (row + col) % 2 == 0 %}
        <rect x="{{ col * 40 - 20 }}" y="{{ row * 40 }}" width="40" height="40"/>
        {% endif %}
      {% endfor %}
    {% endfor %}
  </g>
</svg>
{% endmacro %}

{% macro stripes_br() %}
<svg class="ctx-card__graphic ctx-card__graphic--stripes" viewBox="0 0 140 140" aria-hidden="true">
  <g>
    <rect x="0" y="0" width="24" height="60"/>
    <rect x="38" y="0" width="24" height="60"/>
    <rect x="76" y="0" width="24" height="60"/>
    <rect x="114" y="0" width="24" height="60"/>
    <rect x="0" y="68" width="24" height="72"/>
    <rect x="38" y="68" width="24" height="72"/>
    <rect x="76" y="68" width="24" height="72"/>
    <rect x="114" y="68" width="24" height="72"/>
  </g>
</svg>
{% endmacro %}

{% macro curved_stripes() %}
<svg class="ctx-card__graphic ctx-card__graphic--curves" viewBox="0 0 200 200" aria-hidden="true" fill="none">
  <path d="M 200 0 C 90 0, 0 90, 0 200" stroke="currentColor" stroke-width="16"/>
  <path d="M 200 48 C 120 48, 48 120, 48 200" stroke="currentColor" stroke-width="16"/>
  <path d="M 200 96 C 152 96, 96 152, 96 200" stroke="currentColor" stroke-width="16"/>
  <path d="M 200 144 C 176 144, 144 176, 144 200" stroke="currentColor" stroke-width="16"/>
</svg>
{% endmacro %}

{% macro squiggle_full() %}
<svg class="ctx-card__graphic ctx-card__graphic--squiggle ctx-card__graphic--squiggle-full" viewBox="0 0 712 300" aria-hidden="true" fill="none">
  <path d="M -10 90 C 60 40, 130 70, 155 100 C 175 125, 40 150, 5 175 C -20 195, 90 210, 160 185 C 220 165, 260 105, 300 140 C 330 165, 260 190, 320 205 C 420 230, 470 130, 560 165 C 620 188, 560 235, 640 245 C 690 251, 705 220, 712 210"
    stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
</svg>
{% endmacro %}

{% macro squiggle_thin() %}
<svg class="ctx-card__graphic ctx-card__graphic--squiggle ctx-card__graphic--squiggle-thin" viewBox="0 0 712 260" aria-hidden="true" fill="none">
  <path d="M 0 40 L 480 0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <path d="M 0 260 L 712 130" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
</svg>
{% endmacro %}
